# Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
name: Create Zensical website


# The website contains the WebAssembly game,
# hence it is created from a finished 'Build' workflow
on:
  workflow_run:
    workflows:
      - Build
    branches:
      - main
    types:
      - completed

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  create_zensical_website:
    if: github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install zensical
      - run: zensical build --clean --strict
      - name: Add the game to the website
        uses: actions/download-artifact@v4
        with:
          name: BeerWanter-wasm
          path: site/game
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
